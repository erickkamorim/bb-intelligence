name: etl-carga
# Roda pelo celular: Actions → etl-carga → Run workflow.
# Usa o segredo DATABASE_URL (Neon). Roda sozinho de segunda a sexta às 06h17 (Brasília).
on:
  workflow_dispatch:
    inputs:
      itr_years: { description: "Anos de ITR (separados por espaço)", default: "2025 2026" }
      dfp_years: { description: "Anos de DFP (para o 4T)", default: "2025" }
      sgs_start: { description: "Início das séries do BCB", default: "2016-01-01" }
  schedule:
    - cron: "17 9 * * 1-5"   # 09h17 UTC = 06h17 em Brasília
concurrency: { group: etl, cancel-in-progress: false }
jobs:
  etl:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Conferir segredo
        run: test -n "$DATABASE_URL" || (echo "Segredo DATABASE_URL ausente" && exit 1)
      - name: Migrations e cadastro
        run: alembic upgrade head && python -m etl seed
      - name: ITR
        continue-on-error: true
        run: for y in ${{ inputs.itr_years || '2025 2026' }}; do python -m etl cvm load --doc ITR --year $y; done
      - name: DFP e 4º trimestre
        continue-on-error: true
        run: for y in ${{ inputs.dfp_years || '2025' }}; do python -m etl cvm load --doc DFP --year $y && python -m etl cvm derive-q4 --year $y; done
      - name: Curadoria do RI
        continue-on-error: true
        run: python -m etl ri load --file ../data/manual/ri_bb.csv
      - name: Séries do Banco Central
        continue-on-error: true
        run: |
          python -m etl sgs load --indicator selic_meta --start ${{ inputs.sgs_start || '2016-01-01' }}
          python -m etl sgs load --indicator ipca_mensal --start ${{ inputs.sgs_start || '2016-01-01' }}
      - name: Pares (IF.data)
        continue-on-error: true
        run: python -m etl ifdata load
      - name: Qualidade
        if: always()
        run: |
          python -m etl quality
          python -m etl show --indicator lucro_liquido_contabil
          python -m etl show --indicator lucro_liquido_controladores
          python -m etl show --indicator patrimonio_liquido --period-type instant
          python -m etl show --indicator lucro_liquido_ajustado
          python -m etl show --indicator inad_90
          python -m etl show --indicator selic_meta --period-type daily --last 3
