name: e2e
# Fluxo ponta a ponta: Neon -> API -> Next.js. Sobe os dois serviços e verifica as páginas renderizadas.
on:
  workflow_dispatch: {}
  pull_request: { paths: ["frontend/**", "backend/app/**"] }
jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BB_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf 127.0.0.1:8000/api/v1/health && break; sleep 1; done
      - name: Frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          nohup npm start -- -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null 127.0.0.1:3000 && break; sleep 1; done
      - name: Verificar páginas
        run: |
          set -e
          check() { echo "== $1 deve conter: $2"; curl -sf "127.0.0.1:3000$1" | grep -o "$2" | head -1 | grep -q . && echo OK || (echo FALHOU; exit 1); }
          check "/" "Visão Executiva"
          check "/" "Lucro líquido ajustado"
          check "/" "R\$ 1,27 bi"
          check "/" "Projeto independente, não oficial"
          check "/?period=2026Q2" "R\$ 3,91 bi"
          check "/qualidade" "Cobertura por indicador"
          check "/credito" "Em desenvolvimento"
          code=$(curl -s -o /dev/null -w "%{http_code}" 127.0.0.1:3000/nao-existe); echo "404 -> $code"; test "$code" = "404"
      - if: failure()
        run: tail -50 /tmp/api.log; tail -80 /tmp/web.log
